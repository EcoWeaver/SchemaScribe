[tox]
envlist = lint, type, test
skipsdist = true

[testenv:lint]
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:type]
deps = mypy
commands = mypy

[testenv:test]
deps =
    pytest
    pytest-cov
    pytest-custom-exit-code
commands = pytest --cov=src --cov-report=term-missing --suppress-no-test-exit-code 